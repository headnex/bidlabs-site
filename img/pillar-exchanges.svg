<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <filter id="cyan-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- routing lines connecting glowing countries to a center hub -->
  <g stroke="#3A4256" stroke-width="1.5" fill="none">
    <path d="M 130 130 L 195 200"/>
    <path d="M 290 110 L 215 195"/>
    <path d="M 280 290 L 220 220"/>
    <path d="M 130 280 L 195 215"/>
    <polygon points="200,195 220,205 220,225 200,235 180,225 180,205"/>
  </g>

  <!-- LIT country 1 (top-left, China-like) -->
  <g filter="url(#cyan-glow)" stroke="#00E5FF" stroke-width="2.4" fill="none" stroke-linejoin="round">
    <path d="M 70 90 L 110 70 L 145 80 L 165 105 L 160 135 L 175 155 L 150 175 L 115 175 L 95 160 L 70 145 L 60 120 Z"/>
  </g>

  <!-- LIT country 2 (right-mid, irregular shape) -->
  <g filter="url(#cyan-glow)" stroke="#00E5FF" stroke-width="2.4" fill="none" stroke-linejoin="round">
    <path d="M 250 240 L 295 230 L 335 250 L 340 285 L 320 315 L 280 320 L 245 305 L 230 280 L 235 255 Z"/>
  </g>

  <!-- DIM country 3 (top-right) -->
  <g stroke="#3A4256" stroke-width="1.8" fill="none" stroke-linejoin="round">
    <path d="M 245 60 L 280 50 L 310 60 L 335 80 L 340 110 L 320 130 L 290 135 L 260 125 L 245 100 Z"/>
  </g>

  <!-- DIM country 4 (bottom-left, Brazil-like) -->
  <g stroke="#3A4256" stroke-width="1.8" fill="none" stroke-linejoin="round">
    <path d="M 75 235 L 115 225 L 145 245 L 155 275 L 145 305 L 115 325 L 85 320 L 65 295 L 60 265 Z"/>
  </g>

  <!-- corner geo·filter badges -->
  <g>
    <rect x="280" y="20" width="100" height="26" rx="6" fill="#0F1117" stroke="#2A3144"/>
    <text x="330" y="38" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#8B92A8" letter-spacing="0.6">geo · filter</text>

    <rect x="150" y="360" width="100" height="26" rx="6" fill="#0F1117" stroke="#2A3144"/>
    <text x="200" y="378" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#8B92A8" letter-spacing="0.6">geo · filter</text>
  </g>
</svg>
