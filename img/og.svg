<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1260" fill="none">
  <defs>
    <radialGradient id="og-glow" cx="55%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#B8FF3D" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#5A9F2E" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#07080B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B8FF3D"/>
      <stop offset="60%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#4F8BFF"/>
    </linearGradient>
    <filter id="og-bar-glow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="2400" height="1260" fill="#07080B"/>
  <rect width="2400" height="1260" fill="url(#og-glow)"/>

  <!-- left: typography -->
  <g font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="180" y="700" font-size="220" font-weight="700" fill="#F4F6FB" letter-spacing="-8">Bidlabs.AI</text>
    <text x="184" y="800" font-size="58" font-weight="500" fill="#A6AEC2" letter-spacing="-1">Engineering-led performance marketing.</text>
  </g>

  <!-- right: horizontal bar chart -->
  <g filter="url(#og-bar-glow)" transform="translate(1400, 380)">
    <rect x="0"   y="0"   width="820" height="56" rx="6" fill="url(#bar-grad)"/>
    <rect x="0"   y="100" width="620" height="56" rx="6" fill="url(#bar-grad)"/>
    <rect x="0"   y="200" width="430" height="56" rx="6" fill="url(#bar-grad)"/>
