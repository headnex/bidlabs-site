<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1600" fill="none" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="node-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <radialGradient id="hot-na" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B8FF3D" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#B8FF3D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hot-eu" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B8FF3D" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#B8FF3D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hot-sa" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hot-as" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hot-au" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F8BFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4F8BFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- base black -->
  <rect width="2400" height="1600" fill="#07080B"/>

  <!-- ortho grid -->
  <g stroke="#FFFFFF" stroke-width="1" opacity="0.05">
    <line x1="0" y1="200" x2="2400" y2="200"/>
    <line x1="0" y1="400" x2="2400" y2="400"/>
    <line x1="0" y1="600" x2="2400" y2="600"/>
    <line x1="0" y1="800" x2="2400" y2="800"/>
    <line x1="0" y1="1000" x2="2400" y2="1000"/>
    <line x1="0" y1="1200" x2="2400" y2="1200"/>
    <line x1="0" y1="1400" x2="2400" y2="1400"/>
    <line x1="300" y1="0" x2="300" y2="1600"/>
    <line x1="600" y1="0" x2="600" y2="1600"/>
    <line x1="900" y1="0" x2="900" y2="1600"/>
    <line x1="1200" y1="0" x2="1200" y2="1600"/>
    <line x1="1500" y1="0" x2="1500" y2="1600"/>
    <line x1="1800" y1="0" x2="1800" y2="1600"/>
    <line x1="2100" y1="0" x2="2100" y2="1600"/>
  </g>

  <!-- hot regional glows -->
  <circle cx="550" cy="650" r="320" fill="url(#hot-na)"/>
  <circle cx="1180" cy="540" r="280" fill="url(#hot-eu)"/>
  <circle cx="760" cy="1050" r="260" fill="url(#hot-sa)"/>
  <circle cx="1750" cy="700" r="280" fill="url(#hot-as)"/>
  <circle cx="2050" cy="1180" r="220" fill="url(#hot-au)"/>

  <!-- network constellation: lines -->
  <g stroke-width="1.2" opacity="0.7">
    <!-- North America cluster lines -->
    <g stroke="#B8FF3D">
      <line x1="380" y1="580" x2="480" y2="620"/>
      <line x1="480" y1="620" x2="560" y2="660"/>
      <line x1="560" y1="660" x2="640" y2="640"/>
      <line x1="560" y1="660" x2="540" y2="720"/>
      <line x1="540" y1="720" x2="610" y2="760"/>
      <line x1="640" y1="640" x2="700" y2="680"/>
      <line x1="480" y1="620" x2="430" y2="700"/>
      <line x1="430" y1="700" x2="540" y2="720"/>
    </g>
    <!-- North America to Europe trans-atlantic -->
    <line x1="700" y1="680" x2="1080" y2="540" stroke="#B8FF3D" opacity="0.55"/>
    <line x1="640" y1="640" x2="1180" y2="500" stroke="#B8FF3D" opacity="0.45"/>
    <line x1="610" y1="760" x2="1100" y2="600" stroke="#7FE0B5" opacity="0.4"/>

    <!-- Europe cluster -->
    <g stroke="#9AF06A">
      <line x1="1080" y1="540" x2="1160" y2="500"/>
      <line x1="1160" y1="500" x2="1230" y2="540"/>
      <line x1="1230" y1="540" x2="1190" y2="600"/>
      <line x1="1190" y1="600" x2="1100" y2="600"/>
      <line x1="1100" y1="600" x2="1080" y2="540"/>
      <line x1="1160" y1="500" x2="1180" y2="460"/>
      <line x1="1230" y1="540" x2="1290" y2="500"/>
      <line x1="1290" y1="500" x2="1340" y2="560"/>
    </g>

    <!-- Europe to Asia -->
    <line x1="1290" y1="500" x2="1650" y2="640" stroke="#00E5FF" opacity="0.45"/>
    <line x1="1340" y1="560" x2="1700" y2="700" stroke="#00E5FF" opacity="0.45"/>
    <line x1="1230" y1="540" x2="1620" y2="600" stroke="#00E5FF" opacity="0.35"/>

    <!-- Asia cluster -->
    <g stroke="#00E5FF">
      <line x1="1650" y1="640" x2="1720" y2="680"/>
      <line x1="1720" y1="680" x2="1790" y2="720"/>
      <line x1="1790" y1="720" x2="1860" y2="700"/>
      <line x1="1860" y1="700" x2="1830" y2="640"/>
      <line x1="1830" y1="640" x2="1750" y2="610"/>
      <line x1="1750" y1="610" x2="1650" y2="640"/>
      <line x1="1790" y1="720" x2="1760" y2="800"/>
      <line x1="1860" y1="700" x2="1950" y2="760"/>
    </g>

    <!-- South America cluster -->
    <g stroke="#00E5FF" opacity="0.85">
      <line x1="700" y1="1000" x2="760" y2="1040"/>
      <line x1="760" y1="1040" x2="820" y2="1100"/>
      <line x1="820" y1="1100" x2="780" y2="1170"/>
      <line x1="780" y1="1170" x2="720" y2="1140"/>
      <line x1="720" y1="1140" x2="700" y2="1080"/>
      <line x1="700" y1="1080" x2="700" y2="1000"/>
    </g>
    <line x1="610" y1="760" x2="700" y2="1000" stroke="#5BE6D5" opacity="0.35"/>

    <!-- Asia to Oceania -->
    <line x1="1860" y1="700" x2="1990" y2="1100" stroke="#4F8BFF" opacity="0.4"/>
    <line x1="1950" y1="760" x2="2050" y2="1180" stroke="#4F8BFF" opacity="0.4"/>

    <!-- Oceania cluster -->
    <g stroke="#4F8BFF">
      <line x1="1990" y1="1100" x2="2050" y2="1180"/>
      <line x1="2050" y1="1180" x2="2120" y2="1220"/>
      <line x1="2120" y1="1220" x2="2080" y2="1280"/>
      <line x1="2080" y1="1280" x2="2010" y2="1240"/>
      <line x1="2010" y1="1240" x2="1990" y2="1100"/>
    </g>

    <!-- random faraway thin links -->
    <line x1="200" y1="500" x2="380" y2="580" stroke="#B8FF3D" opacity="0.3"/>
    <line x1="2200" y1="500" x2="1950" y2="610" stroke="#4F8BFF" opacity="0.3"/>
    <line x1="2280" y1="780" x2="2080" y2="700" stroke="#4F8BFF" opacity="0.3"/>
    <line x1="1500" y1="240" x2="1290" y2="380" stroke="#9AF06A" opacity="0.25"/>
  </g>

  <!-- network nodes (dots) -->
  <g filter="url(#node-glow)">
    <g fill="#B8FF3D">
      <circle cx="380" cy="580" r="6"/>
      <circle cx="480" cy="620" r="8"/>
      <circle cx="560" cy="660" r="9"/>
      <circle cx="640" cy="640" r="7"/>
      <circle cx="700" cy="680" r="6"/>
      <circle cx="540" cy="720" r="5"/>
      <circle cx="610" cy="760" r="5"/>
      <circle cx="430" cy="700" r="4"/>
      <circle cx="200" cy="500" r="3"/>
    </g>
    <g fill="#9AF06A">
      <circle cx="1080" cy="540" r="6"/>
      <circle cx="1160" cy="500" r="9"/>
      <circle cx="1230" cy="540" r="11"/>
      <circle cx="1190" cy="600" r="7"/>
      <circle cx="1100" cy="600" r="5"/>
      <circle cx="1180" cy="460" r="5"/>
      <circle cx="1290" cy="500" r="6"/>
      <circle cx="1340" cy="560" r="5"/>
      <circle cx="1500" cy="240" r="4"/>
    </g>
    <g fill="#00E5FF">
      <circle cx="1650" cy="640" r="6"/>
      <circle cx="1720" cy="680" r="7"/>
      <circle cx="1790" cy="720" r="9"/>
      <circle cx="1860" cy="700" r="7"/>
      <circle cx="1830" cy="640" r="6"/>
      <circle cx="1750" cy="610" r="5"/>
      <circle cx="1760" cy="800" r="4"/>
      <circle cx="1950" cy="760" r="5"/>
      <circle cx="2200" cy="500" r="3"/>
      <circle cx="2280" cy="780" r="4"/>
    </g>
    <g fill="#00E5FF">
      <circle cx="700" cy="1000" r="6"/>
      <circle cx="760" cy="1040" r="7"/>
      <circle cx="820" cy="1100" r="9"/>
      <circle cx="780" cy="1170" r="6"/>
      <circle cx="720" cy="1140" r="5"/>
      <circle cx="700" cy="1080" r="4"/>
    </g>
    <g fill="#4F8BFF">
      <circle cx="1990" cy="1100" r="6"/>
      <circle cx="2050" cy="1180" r="9"/>
      <circle cx="2120" cy="1220" r="6"/>
      <circle cx="2080" cy="1280" r="5"/>
      <circle cx="2010" cy="1240" r="4"/>
    </g>
  </g>
</svg>
